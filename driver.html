<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Sign In | Salamence Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .main-navigation { left: 0; }
        .driver-auth { max-width: 520px; margin: 24px auto; }
        .driver-auth input {
            width: 100%;
            min-height: 42px;
            margin: 8px 0 16px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        .driver-auth label {
            display: block;
            color: #475569;
            font-size: 14px;
            font-weight: bold;
        }
        .driver-message { min-height: 24px; margin-top: 12px; }
    </style>
</head>
<body class="portal-layout">
    <header class="main-navigation">
        <a href="driver.html" class="brand-name">Salamence Tracker | Driver</a>
        <nav class="top-nav-links">
            <a href="supplier.html" data-portal-switch>Supplier Sign In</a>
        </nav>
    </header>
    <main class="main-content" style="margin-left:0;width:100%;max-width:1100px;margin-right:auto;">
        <section class="content-card driver-auth">
            <h1>Driver Portal</h1>
            <p>Sign in to view assigned packages and share your live location.</p>
            <form id="driver-login-form">
                <h2>Driver Sign In</h2>
                <label for="driver-login-email">Email</label>
                <input id="driver-login-email" type="email" autocomplete="username" required>
                <label for="driver-login-password">Password</label>
                <input id="driver-login-password" type="password" autocomplete="current-password" required>
                <button type="submit" id="driver-login-button">Sign In</button>
            </form>
            <hr style="margin:24px 0;border:0;border-top:1px solid #e2e8f0;">
            <form id="driver-signup-form">
                <h2>Create Driver Account</h2>
                <label for="driver-signup-email">Email</label>
                <input id="driver-signup-email" type="email" autocomplete="email" required>
                <label for="driver-signup-password">Password (at least 6 characters)</label>
                <input id="driver-signup-password" type="password" minlength="6" autocomplete="new-password" required>
                <button type="submit" id="driver-signup-button">Create Driver Account</button>
            </form>
            <p id="driver-auth-message" class="driver-message" role="status" aria-live="polite"></p>
            <p><a href="login.html">Administrator sign in</a> · <a href="supplier.html">Supplier Portal</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="portal-switch.js"></script>
    <script src="driver.js"></script>
</body>
</html>
